name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache AI model
        uses: actions/cache@v4
        with:
          path: ~/.cache/vidtextswap
          key: lama-2025jan
      - name: Test
        env:
          VIDTEXTSWAP_TEST_AI: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: pytest -q
